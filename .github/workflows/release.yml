name: Release
run-name: Release build ${{ inputs.platform }} ${{ github.ref_name }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Build platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - mac
          - linux
      expected_sha:
        description: "Expected commit for automatic dispatches; leave empty for manual runs"
        required: false
        type: string

concurrency:
  group: ${{ endsWith(github.ref_name, '.x') && format('release-state-{0}', github.ref_name) || 'release-state' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: Prepare release ref
    if: github.repository == 'DeJeune/cherry-studio'
    runs-on: ubuntu-latest
    outputs:
      remote-tag-sha: ${{ steps.release-state.outputs.remote-tag-sha }}
      tag: ${{ steps.release-ref.outputs.tag }}
      baseline-tag: ${{ steps.release-ref.outputs.baseline-tag }}
    steps:
      - name: Verify automatically selected release commit
        if: inputs.expected_sha != ''
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          if [ "$GITHUB_SHA" != "$EXPECTED_SHA" ]; then
            echo "Release branch moved from automatic selection $EXPECTED_SHA to $GITHUB_SHA" >&2
            exit 1
          fi

      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
      - uses: pnpm/action-setup@v5
      - name: Install release resolver dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/release-deps" --ignore-scripts --no-audit --no-fund semver@7.7.2 yaml@2.8.2
          echo "NODE_PATH=$RUNNER_TEMP/release-deps/node_modules" >> "$GITHUB_ENV"

      - name: Resolve release branch and version
        id: release-ref
        uses: actions/github-script@v8
        with:
          script: |
            if (!context.ref.startsWith('refs/heads/')) throw new Error('Release builds require a branch')
            const { resolveLineBuild } = require('./scripts/release/release-line-build')
            const build = await resolveLineBuild({ github, repo: context.repo, branch: context.ref.slice(11), sha: context.sha })
            if (!build) throw new Error('No buildable release version exists on this branch')
            core.setOutput('tag', build.tag)
            core.setOutput('baseline-tag', build.baselineTag || '')

      - name: Verify release commit passed CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CI_RUN="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" \
            -f event=push \
            -f status=completed \
            -F per_page=100 \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0] // empty')"

          if [ -z "$CI_RUN" ]; then
            echo "No successful CI push run found for release commit $GITHUB_SHA" >&2
            exit 1
          fi

          if [ "$(jq -r '.head_sha' <<< "$CI_RUN")" != "$GITHUB_SHA" ] || \
             [ "$(jq -r '.event' <<< "$CI_RUN")" != "push" ] || \
             [ "$(jq -r '.status' <<< "$CI_RUN")" != "completed" ] || \
             [ "$(jq -r '.conclusion' <<< "$CI_RUN")" != "success" ]; then
            echo "CI result did not match the exact release commit" >&2
            exit 1
          fi

          echo "Verified successful CI run: $(jq -r '.html_url' <<< "$CI_RUN")"

      - name: Validate and update release state
        id: release-state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release-ref.outputs.tag }}
        run: |
          BRANCH="$GITHUB_REF_NAME"
          RELEASE_PAGES="$(gh api --paginate --slurp "repos/$REPO/releases?per_page=100")"
          RELEASE="$(jq -c --arg tag "$TAG" '
            [.[][] | select(.tag_name == $tag)] |
            .[0] // empty
          ' <<< "$RELEASE_PAGES")"

          BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          echo "remote-tag-sha=$REMOTE_TAG_SHA" >> "$GITHUB_OUTPUT"
          BRANCH_SHA="$BRANCH_SHA" \
          PLATFORM="${{ github.event.inputs.platform }}" \
          RELEASE_JSON="$RELEASE" \
          REMOTE_TAG_SHA="$REMOTE_TAG_SHA" \
          TAG="$TAG" \
          WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-start

  release:
    name: Build fixture artifacts (NOT application packages)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Generate fixture artifact bound to selected SHA
        run: |
          mkdir fixture-artifacts
          printf 'FORK SMOKE TEST ONLY\\nsha=%s\\ntag=%s\\n' "$GITHUB_SHA" "${{ needs.prepare.outputs.tag }}" > fixture-artifacts/FORK-SMOKE-ONLY.txt
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.prepare.outputs.tag }}-fixture
          path: fixture-artifacts/*
          if-no-files-found: error
          retention-days: 1

  finalize-build:
    name: Update draft release
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download existing draft artifacts
        if: github.event.inputs.platform != 'all'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release download "$TAG" --dir existing-release-artifacts

      - name: Download selected release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-${{ needs.prepare.outputs.tag }}-*
          path: selected-release-artifacts
          merge-multiple: true

      - name: Assemble complete release artifacts
        shell: bash
        run: |
          mkdir release-artifacts
          if [ -d existing-release-artifacts ]; then
            cp -R existing-release-artifacts/. release-artifacts/
          fi
          cp -R selected-release-artifacts/. release-artifacts/

      - name: Revalidate current release head
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          BRANCH_SHA="$BRANCH_SHA" TAG="$TAG" WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-completion

      - name: Prepare bilingual release notes
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node scripts/release/compose-release-body.js \
            electron-builder.yml \
            - \
            "$RUNNER_TEMP/release-body.md" \
            "$REPO" \
            "$TAG" \
            "Cherry Studio"

      - name: Create or update draft release
        id: draft-release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: "release-artifacts/*"
          bodyFile: ${{ runner.temp }}/release-body.md
          commit: ${{ github.sha }}
          draft: true
          makeLatest: false
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          replacesArtifacts: true
          tag: ${{ needs.prepare.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          updateOnlyUnreleased: true

      - name: Validate uploaded draft
        id: uploaded-draft
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          RELEASE="$(gh api "repos/$REPO/releases/$RELEASE_ID")"
          BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          BRANCH_SHA="$BRANCH_SHA" RELEASE_JSON="$RELEASE" TAG="$TAG" WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-completion

      - name: Move draft tag with lease after artifact upload
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          EXPECTED_TAG_SHA: ${{ needs.prepare.outputs.remote-tag-sha }}
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ github.event.inputs.platform }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          RELEASE="$(gh api "repos/$REPO/releases/$RELEASE_ID")"
          BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          BRANCH_SHA="$BRANCH_SHA" RELEASE_JSON="$RELEASE" TAG="$TAG" WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-completion

          REMOTE_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          if [ "$PLATFORM" = "all" ]; then
            if [ -z "$EXPECTED_TAG_SHA" ]; then
              if [ -z "$REMOTE_TAG_SHA" ]; then
                gh api --method POST "repos/$REPO/git/refs" \
                  -f ref="refs/tags/$TAG" \
                  -f sha="$GITHUB_SHA" >/dev/null
              elif [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
                echo "Tag $TAG was created at $REMOTE_TAG_SHA during artifact upload" >&2
                exit 1
              fi
            elif [ "$REMOTE_TAG_SHA" != "$EXPECTED_TAG_SHA" ]; then
              echo "Tag $TAG moved from $EXPECTED_TAG_SHA to $REMOTE_TAG_SHA during the build" >&2
              exit 1
            elif [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
              REPOSITORY_ID="$(gh api "repos/$REPO" --jq '.node_id')"
              jq -n \
                --arg repositoryId "$REPOSITORY_ID" \
                --arg name "refs/tags/$TAG" \
                --arg beforeOid "$EXPECTED_TAG_SHA" \
                --arg afterOid "$GITHUB_SHA" \
                '{
                  query: "mutation($input: UpdateRefsInput!) { updateRefs(input: $input) { clientMutationId } }",
                  variables: {
                    input: {
                      repositoryId: $repositoryId,
                      refUpdates: [{
                        name: $name,
                        beforeOid: $beforeOid,
                        afterOid: $afterOid,
                        force: true
                      }]
                    }
                  }
                }' > "$RUNNER_TEMP/move-release-tag.json"
              gh api graphql --input "$RUNNER_TEMP/move-release-tag.json" >/dev/null
            fi
          elif [ "$REMOTE_TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Single-platform retries must not move $TAG away from its existing release commit" >&2
            exit 1
          fi

          FINAL_TAG_SHA="$(git ls-remote origin "refs/tags/$TAG" | awk 'NR == 1 { print $1 }')"
          if [ "$FINAL_TAG_SHA" != "$GITHUB_SHA" ]; then
            echo "Tag $TAG does not point to $GITHUB_SHA after draft finalization" >&2
            exit 1
          fi
          FINAL_RELEASE="$(gh api "repos/$REPO/releases/$RELEASE_ID")"
          BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          BRANCH_SHA="$BRANCH_SHA" RELEASE_JSON="$FINAL_RELEASE" TAG="$TAG" WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-completion
          if [ "$(jq -r '.draft' <<< "$FINAL_RELEASE")" != "true" ]; then
            echo "Release $TAG was published while the build was finalizing" >&2
            exit 1
          fi

      - name: Add generated changes to release notes
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(needs.prepare.outputs.tag, '-') }}
          RELEASE_ID: ${{ steps.draft-release.outputs.id }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          LINE_BASELINE: ${{ needs.prepare.outputs.baseline-tag }}
        run: |
          PREVIOUS_TAG="$LINE_BASELINE"
          if [ -z "$PREVIOUS_TAG" ]; then
            # Exact-version branches fork from main, so ancestry alone cannot select their baseline.
            RELEASE_PAGES="$(gh api --paginate --slurp "repos/$REPO/releases?per_page=100")"
            PREVIOUS_TAG="$(jq -r \
              --arg tag "$TAG" \
              --argjson includePrereleases "$PRERELEASE" \
              '[.[][] | select(.draft | not) | select(.tag_name != $tag) | select($includePrereleases or (.prerelease | not))]
               | sort_by(.published_at) | (last | .tag_name) // empty' <<< "$RELEASE_PAGES")"
          fi
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No published release is available as the previous tag for $TAG" >&2
            exit 1
          fi
          echo "Generating changes since $PREVIOUS_TAG"
          gh api --method POST "repos/$REPO/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f previous_tag_name="$PREVIOUS_TAG" \
            --jq '.body' > "$RUNNER_TEMP/generated-release-notes.md"
          node scripts/release/compose-release-body.js \
            electron-builder.yml \
            "$RUNNER_TEMP/generated-release-notes.md" \
            "$RUNNER_TEMP/release-body.md" \
            "$REPO" \
            "$TAG" \
            "Cherry Studio"
          # PATCH without tag_name resets a draft to untagged-<sha>
          jq -Rs --arg tag "$TAG" '{tag_name: $tag, body: .}' < "$RUNNER_TEMP/release-body.md" > "$RUNNER_TEMP/release-body.json"
          RELEASE="$(gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" \
            --input "$RUNNER_TEMP/release-body.json")"
          BRANCH_SHA="$(gh api "repos/$REPO/git/ref/heads/$BRANCH" --jq '.object.sha')"
          BRANCH_SHA="$BRANCH_SHA" RELEASE_JSON="$RELEASE" TAG="$TAG" WORKFLOW_SHA="$GITHUB_SHA" \
            node scripts/release/validate-release-state.js build-completion
          if [ -z "$(jq -r '.body // empty' <<< "$RELEASE")" ]; then
            echo "Draft release $TAG has no release notes" >&2
            exit 1
          fi
